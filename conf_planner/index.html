<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>Conference Planners</title>
  <style>
    :root{--ink:#172033;--muted:#667085;--line:#e4e7ec;--paper:#fff;--wash:#f4f6f8;--brand:#0e7490;--brand2:#155e75;--shadow:0 10px 30px rgba(16,24,40,.09)}
    *{box-sizing:border-box}html{background:var(--wash);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}body{margin:0}.shell{width:min(820px,100%);min-height:100vh;margin:auto;padding:max(28px,env(safe-area-inset-top)) clamp(16px,5vw,44px) max(52px,env(safe-area-inset-bottom));background:var(--paper)}
    .eyebrow{font-size:.76rem;font-weight:850;letter-spacing:.1em;text-transform:uppercase;color:var(--brand)}h1{margin:5px 0 8px;font-size:clamp(1.8rem,6vw,2.8rem);line-height:1.08}.intro{max-width:590px;margin:0;color:var(--muted);line-height:1.55}.list{display:grid;gap:13px;margin-top:30px}.conference{display:grid;grid-template-columns:1fr auto;align-items:center;gap:18px;padding:18px;border:1px solid var(--line);border-radius:16px;color:inherit;text-decoration:none;background:#fff;box-shadow:0 4px 16px rgba(16,24,40,.04);transition:.16s}.conference:hover{border-color:#9bcbd6;box-shadow:var(--shadow);transform:translateY(-1px)}.conference h2{margin:0 0 7px;font-size:1.08rem;line-height:1.25}.meta{display:flex;flex-wrap:wrap;gap:5px 14px;color:var(--muted);font-size:.84rem}.open{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:#ecfeff;color:var(--brand2);font-size:1.25rem;font-weight:800}.empty{padding:36px 0;color:var(--muted)}
    @media(max-width:520px){.conference{padding:15px}.conference h2{font-size:1rem}.meta{display:grid;gap:3px}.open{width:36px;height:36px}}
  </style>
</head>
<body><main class="shell"><div class="eyebrow">Personal schedule tools</div><h1>Conference planners</h1><p class="intro">Choose a conference to browse talks, build a private PIN-synced schedule, and find rooms.</p><section class="list" id="list" aria-live="polite"></section></main>
<script>
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
fetch("conferences.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(items=>{
  items.sort((a,b)=>b.startDate.localeCompare(a.startDate));
  document.querySelector("#list").innerHTML=items.map(c=>`<a class="conference" href="${encodeURI(c.path)}"><div><h2>${esc(c.name)}</h2><div class="meta"><strong>${esc(c.plannerDays)}</strong><span>${esc(c.location)}</span></div></div><span class="open" aria-hidden="true">›</span></a>`).join("")||'<div class="empty">No conference planners are available yet.</div>';
}).catch(()=>document.querySelector("#list").innerHTML='<div class="empty">The conference list could not be loaded. Please refresh.</div>');
</script></body></html>
